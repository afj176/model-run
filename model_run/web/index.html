    <script>
      // Paint in the saved theme straight away; the app keeps it current afterwards.
      try {
        var t = localStorage.getItem("model-run.theme");
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
